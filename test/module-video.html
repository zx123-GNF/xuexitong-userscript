<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学习通任务点（视频模块）仿真</title>
<style>
  html, body { margin: 0; padding: 0; font: 14px/1.5 "Microsoft YaHei", sans-serif; }
  video { display: block; width: 100%; height: 300px; background: #000; }
  .jb_btn { padding: 12px; text-align: center; background: #f4f6fa; }
  .jb_btn a { display: inline-block; padding: 8px 26px; margin: 0 6px; background: #4a90d9;
    color: #fff; border-radius: 4px; text-decoration: none; cursor: pointer; }
  #quizArea { padding: 12px; }
  .TiMu { padding: 8px; background: #fff6d8; border: 1px solid #e6cf7a; margin-bottom: 8px; }
</style>
</head>
<body>
  <video id="v"></video>
  <div class="jb_btn" id="barBox">
    <a href="javascript:;" id="deadNext" class="nextBtn">下一节</a>
    <a href="javascript:;" id="realNext" class="nextBtn">下一节</a>
  </div>
  <div id="quizArea"></div>
  <script>
    // 诱饵：点了什么都不发生（模拟“点错了/被挡住”的下一节）
    document.getElementById('deadNext').addEventListener('click', function () { /* no-op */ });
    // 真按钮：把当前任务点切换到答题区（这里用插入题目块模拟）
    document.getElementById('realNext').addEventListener('click', function () {
      var q = document.createElement('div');
      q.className = 'TiMu';
      q.textContent = '1. 仿真题目：下列说法正确的是（ ） A. 甲 B. 乙 C. 丙 D. 丁';
      document.getElementById('quizArea').appendChild(q);
    });
  </script>
</body>
</html>
